{{ define "main" }}
<section class="section">
  <div class="wrap">
    <h2>{{ .Title }}</h2>
    <div class="story-text" style="margin-top: 24px;">
      {{ range .Pages }}
        <article style="margin-bottom: 24px;">
          <h3><a href="{{ .RelPermalink }}" style="color: var(--color-navy);">{{ .Title }}</a></h3>
          <p>{{ .Summary }}</p>
        </article>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}

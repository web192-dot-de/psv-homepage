{{ define "main" }}
<section class="section">
  <div class="wrap">
    <!-- Zurück-Link zur Übersicht -->
    <a href="/mannschaften/" style="color: var(--color-gold); font-weight: 600; font-size: 0.9rem; text-transform: uppercase;">← Alle Mannschaften</a>
    
    <h2 style="margin-top: 16px; font-size: 2.5rem;">{{ .Title }}</h2>
    
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 24px; margin: 32px 0; background: #fff; border: 1px solid #E1E5F2; padding: 24px;">
      <div><strong>Liga:</strong> <p>{{ .Params.liga }}</p></div>
      <div><strong>Trainer:</strong> <p>{{ .Params.trainer }}</p></div>
      <div><strong>Trainingszeiten:</strong> <p>{{ .Params.trainingszeiten }}</p></div>
    </div>

    <div class="story-text" style="font-size: 1.1rem; line-height: 1.8;">
      {{ .Content }}
    </div>
  </div>
</section>
{{ end }}

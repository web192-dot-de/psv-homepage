{{ define "main" }}
<section class="section">
  <div class="wrap">

    <h2 class="page-title">Unsere Mannschaften</h2>
    <p class="page-intro">Hier findest du alle Teams des PSV im Überblick.</p>

    <!--
      Das Raster (.teams-grid) steht EINMAL um alle Karten herum.
      Jede Mannschaft ist eine Karte (.team-card) und damit ein Rasterfeld.
      Reihenfolge: optional per "weight = 1, 2, 3 …" im Kopf der Mannschaftsseite steuerbar.
    -->
    <div class="teams-grid">
      {{ range .RegularPages.ByWeight }}
        {{ partial "team-card.html" . }}
      {{ end }}
    </div>

  </div>
</section>
{{ end }}

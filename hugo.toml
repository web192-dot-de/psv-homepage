    weight = 1
  [[menu.main]]
    name   = "Aktuelles"
    url    = "/#aktuelles"
    weight = 2
  [[menu.main]]
	name = "Mannschaften"
	url = "/mannschaften"
	weight = 3
[[menu.main]]
    name   = "Training"
    url    = "/#kontakt"
    weight = 4


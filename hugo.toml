baseURL = "https://github.io"
locale = "de-de"
title = "Penzliner SV Handball"

[params]
  # --- Vereinsidentität: hier änderst du Name, Farben & Logo zentral ---
  clubName        = "Penzliner SV"
  clubNameFull    = "Penzliner SV Handball"
  foundedYear     = "2012"
  logo            = "/images/logo.png"      # eigenes Logo hier ablegen (siehe README)
  logoAlt         = "Wappen Penzliner SV"

  # --- Farben (werden als CSS-Variablen ausgegeben, siehe partials/head.html) ---
  colorNavy       = "#0118ca"   # Hauptfarbe, blau
  colorRoyal      = "#ffef01"   # Sekundärfarbe, Gelb
  colorGold       = "#ffef01"   # Akzentfarbe
  colorPaper      = "#F4F6FB"   # Heller Hintergrund
  colorCharcoal   = "#12204F"   # Fließtext-Farbe

  # --- Kontakt (im Footer verwendet) ---
  address         = "Am See 4a,17217 Penzlin"
  email           = "handball@penzliner-sv.de"
  # --- Adresse Turnalle 
  # --- Wilhelm-Scharff-Allee 6 · 17217 Penzlin ---
  
  # --- Externes Portal (Spielplan/Ergebnisse) ---
  # Sobald ihr euch entscheidet, hier die URL eintragen — wird dann automatisch
  # als Button/Link auf der Startseite angezeigt (siehe layouts/index.html)
  portalUrl       = ""
  portalLabel     = "Spielplan & Ergebnisse ansehen"

  # --- wenn aktiviert - wird ein Popup gezeigt  
  wartung = true
[menu]
  [[menu.main]]
    name   = "Start"
    url    = "/"
    weight = 1
  [[menu.main]]
	name = "Mannschaften"
	url = "/mannschaften/"
	weight = 2
  [[menu.main]]
    name   = "Verein"
    url    = "/#verein"
    weight = 3
  [[menu.main]]
    name   = "Training"
    url    = "/#training"
    weight = 4
  [[menu.main]]
    name   = "Kontakt"
    url    = "/#kontakt"
    weight = 5
